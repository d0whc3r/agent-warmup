# golangci-lint v2 configuration. Run it with `make lint` and `make fmt`.
# Reference: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      # A switch with a default case counts as exhaustive.
      default-signifies-exhaustive: true
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # the code passes domain structs by value on purpose
        - rangeValCopy # same reason, for range loops
        - unnamedResult
        - whyNoLint # nolintlint already requires a reason
    gosec:
      excludes:
        - G104 # errcheck already reports unchecked errors, with the std-error-handling exclusions
        - G204 # this tool exists to run agent CLIs, tmux, launchctl, and crontab
        - G304 # file paths come from the resolved home, not from a network peer
        - G703 # same reason, for the taint-based path traversal check
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: early-return
        - name: flag-parameter # use a typed option, not a bool parameter
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, gosec, perfsprint, prealloc, revive]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/d0whc3r/agent-warmup
    goimports:
      local-prefixes:
        - github.com/d0whc3r/agent-warmup

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
